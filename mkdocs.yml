site_name: pyGTFSHandler
site_description: Handle GTFS files fast in python
repo_url: https://github.com/CityScope/pyGTFSHandler
repo_name: pyGTFSHandler

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - GTFS Format Reference: gtfs-format.md
  - Adding a downloader: contributing_downloader.md
  - API Reference:
      - Overview: api/index.md
      - Feed: api/feed.md
      - Models:
          - Calendar: api/models/calendar.md
          - Frequencies: api/models/frequencies.md
          - Routes: api/models/routes.md
          - Shapes: api/models/shapes.md
          - Stops: api/models/stops.md
          - Stop Times: api/models/stop_times.md
          - Trips: api/models/trips.md
      - Analysis:
          - Edges: api/analysis/edges.md
          - Filtering: api/analysis/filtering.md
          - Stops: api/analysis/stops.md
      - Downloaders:
          - Base: api/downloaders/base.md
          - Mobility Database: api/downloaders/mobility_database.md
          - Mobility Database catalog (no key): api/downloaders/mobility_database_catalog.md
          - TransitLand: api/downloaders/transitland.md
          - Spain (NAP): api/downloaders/spain.md
      - Maps:
          - Conflict Map: api/maps/conflict_map.md
          - Edge Metrics: api/maps/edge_metrics.md
          - Route Map: api/maps/route_map.md
          - Style: api/maps/style.md
      - Utils: api/utils.md
      - Other modules:
          - cache: api/more/cache.md
          - downloaders.usa: api/more/downloaders/usa.md
          - downloaders.usa.brt: api/more/downloaders/usa/brt.md
          - downloaders.usa.ntd: api/more/downloaders/usa/ntd.md
          - downloaders.usa.us_feeds: api/more/downloaders/usa/us_feeds.md
          - downloaders.utils: api/more/downloaders/utils.md
          - downloaders.utils.aoi: api/more/downloaders/utils/aoi.md
          - downloaders.utils.config: api/more/downloaders/utils/config.md
          - downloaders.utils.coverage_check: api/more/downloaders/utils/coverage_check.md
          - downloaders.utils.dates: api/more/downloaders/utils/dates.md
          - downloaders.utils.download: api/more/downloaders/utils/download.md
          - downloaders.utils.fleet_frequency: api/more/downloaders/utils/fleet_frequency.md
          - downloaders.utils.historic: api/more/downloaders/utils/historic.md
          - downloaders.utils.http: api/more/downloaders/utils/http.md
          - downloaders.utils.models: api/more/downloaders/utils/models.md
          - downloaders.utils.naming: api/more/downloaders/utils/naming.md
          - downloaders.utils.osm_extract: api/more/downloaders/utils/osm_extract.md
          - plots: api/more/plots.md
          - plots.example_notebooks: api/more/plots/example_notebooks.md
          - representative_date: api/more/representative_date.md
          - utils.basemap: api/more/utils/basemap.md
          - utils.feed_dedupe: api/more/utils/feed_dedupe.md
          - utils.io: api/more/utils/io.md
          - utils.plot_helpers: api/more/utils/plot_helpers.md
          - utils.processing_helpers: api/more/utils/processing_helpers.md
          - utils.stack_gtfs: api/more/utils/stack_gtfs.md
          - utils.trip_dedupe: api/more/utils/trip_dedupe.md
  - Methodology:
      - Overview: methodology/index.md
      - Calendar Handling: methodology/calendar.md
      - Frequency Expansion: methodology/frequencies.md
      - Direction & Headway: methodology/direction-headway.md
      - Edges & Filtering: methodology/edges-filtering.md
      - GTFS for a New Area (agent guide): methodology/new_area_gtfs_agent_guide.md
  - Examples:
      - Overview: examples/index.md
      - Quickstart: examples/quickstart.ipynb
      - Cambridge, MA Example: examples/cambridge_massachusetts_usa_example.ipynb
      - Direction & Headway Methodology (notebook): examples/direction_and_headway_methodology.ipynb
      - Direction Conflicts (notebook): examples/direction_conflicts.ipynb

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js?v=2
  - javascripts/vendor/tex-svg.js?v=2

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            preload_modules: [geohierarchy]   # functions re-exported from geohierarchy (a dependency) are documented from it
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            members_order: source
            filters: ["!^_"]
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      ignore: ["*.md"]
      include_source: true
      execute: false
      ignore_h1_titles: true

extra_css:
  - stylesheets/extra.css
